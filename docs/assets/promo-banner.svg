<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">mcp-me promotional banner</title>
  <desc id="desc">A dark promotional graphic showing mcp-me turning a local personal profile into relevant context for AI assistants.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d18"/>
      <stop offset="0.52" stop-color="#0a1c31"/>
      <stop offset="1" stop-color="#13395e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9ddff"/>
      <stop offset="1" stop-color="#4ea1e0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102943"/>
      <stop offset="1" stop-color="#0b1b2e"/>
    </linearGradient>
    <radialGradient id="glow-blue">
      <stop offset="0" stop-color="#4ea1e0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4ea1e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-yellow">
      <stop offset="0" stop-color="#f5d76e" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f5d76e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#a3d7ff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#01050a" flood-opacity="0.54"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1280" cy="360" r="520" fill="url(#glow-blue)"/>
  <circle cx="270" cy="750" r="350" fill="url(#glow-yellow)"/>
  <path d="M0 739C240 676 415 804 662 755C890 709 1088 605 1329 657C1448 682 1526 733 1600 778V900H0Z" fill="#050d17" opacity="0.72"/>

  <g transform="translate(92 82)">
    <circle cx="31" cy="31" r="31" fill="#e8f4ff"/>
    <circle cx="29" cy="26" r="10" fill="url(#blue)"/>
    <path d="M14 51c0-10 6-17 15-17s15 7 15 17" fill="none" stroke="#4ea1e0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="47" cy="15" r="7" fill="#f5d76e"/>
    <path d="M47 4v22M36 15h22" stroke="#f5d76e" stroke-width="3" stroke-linecap="round"/>
    <text x="81" y="43" fill="#f8fbff" font-family="Inter,Segoe UI,sans-serif" font-size="35" font-weight="750">mcp-me</text>
    <rect x="232" y="13" width="128" height="36" rx="18" fill="#153c31" stroke="#287357"/>
    <circle cx="253" cy="31" r="5" fill="#3fb950"/>
    <text x="268" y="36" fill="#9be3bb" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="750" letter-spacing="1">OPEN SOURCE</text>
  </g>

  <g transform="translate(92 242)">
    <text fill="#f8fbff" font-family="Inter,Segoe UI,sans-serif" font-size="72" font-weight="780" letter-spacing="-3">
      <tspan x="0" y="0">Stop reintroducing</tspan>
      <tspan x="0" y="84">yourself to AI.</tspan>
    </text>
    <text x="0" y="176" fill="#acc5d9" font-family="Inter,Segoe UI,sans-serif" font-size="25">
      <tspan x="0">Keep your experience, skills, projects, and preferences</tspan>
      <tspan x="0" dy="38">in one local profile. Share them through MCP.</tspan>
    </text>

    <g transform="translate(0 290)" filter="url(#shadow)">
      <rect width="624" height="188" rx="24" fill="#0d2035" stroke="#2f5e80" stroke-width="2"/>
      <rect x="22" y="22" width="80" height="28" rx="14" fill="#183b59"/>
      <text x="62" y="41" text-anchor="middle" fill="#8fc8ef" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="750" letter-spacing="1">PROMPT</text>
      <text x="24" y="89" fill="#f1f7fc" font-family="Inter,Segoe UI,sans-serif" font-size="19">"Write an introduction for this conference."</text>
      <path d="M24 116H600" stroke="#29465d"/>
      <circle cx="37" cy="145" r="8" fill="#3fb950"/>
      <text x="57" y="152" fill="#9ab6ca" font-family="Inter,Segoe UI,sans-serif" font-size="15">Context loaded from me://career and me://projects</text>
    </g>
  </g>

  <g transform="translate(890 112)" filter="url(#shadow)">
    <rect width="610" height="690" rx="38" fill="#0a192b" stroke="#376b91" stroke-width="2"/>
    <g transform="translate(32 30)">
      <circle cx="8" cy="8" r="6" fill="#ef6a6a"/>
      <circle cx="30" cy="8" r="6" fill="#f5d76e"/>
      <circle cx="52" cy="8" r="6" fill="#3fb950"/>
      <text x="514" y="14" text-anchor="end" fill="#6689a3" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">mcp://me</text>
    </g>

    <g transform="translate(59 91)">
      <path d="M246 126V77M246 77H86M246 77h160M246 374v56M246 430H86M246 430h160" fill="none" stroke="#4e99ce" stroke-opacity="0.58" stroke-width="2"/>
      <path d="M86 77v47M406 77v47M86 430v-52M406 430v-52" fill="none" stroke="#4e99ce" stroke-opacity="0.58" stroke-width="2"/>

      <g transform="translate(123 126)">
        <rect width="246" height="248" rx="32" fill="url(#panel)" stroke="#4e90bd" stroke-width="2"/>
        <circle cx="123" cy="87" r="59" fill="#e8f4ff"/>
        <circle cx="118" cy="78" r="22" fill="url(#blue)"/>
        <path d="M84 126c0-25 13-40 34-40s34 15 34 40" fill="none" stroke="#4ea1e0" stroke-width="10" stroke-linecap="round"/>
        <circle cx="159" cy="52" r="13" fill="#f5d76e"/>
        <path d="M159 33v38M140 52h38" stroke="#f5d76e" stroke-width="5" stroke-linecap="round"/>
        <text x="123" y="178" text-anchor="middle" fill="#f8fbff" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="750">your profile</text>
        <text x="123" y="206" text-anchor="middle" fill="#87a8c0" font-family="Inter,Segoe UI,sans-serif" font-size="14">private / structured / portable</text>
      </g>

      <g>
        <rect width="172" height="78" rx="18" fill="#102a45" stroke="#315a78"/>
        <circle cx="30" cy="28" r="10" fill="#82c4f2"/>
        <text x="52" y="33" fill="#edf7ff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">Career</text>
        <text x="24" y="59" fill="#7798af" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11">me://career</text>
      </g>
      <g transform="translate(320)">
        <rect width="172" height="78" rx="18" fill="#102a45" stroke="#315a78"/>
        <path d="M20 20h20v20H20z" fill="none" stroke="#f5d76e" stroke-width="3"/>
        <text x="52" y="33" fill="#edf7ff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">Projects</text>
        <text x="24" y="59" fill="#7798af" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11">me://projects</text>
      </g>
      <g transform="translate(0 430)">
        <rect width="172" height="78" rx="18" fill="#102a45" stroke="#315a78"/>
        <path d="M20 30l10-10 10 10-10 10z" fill="none" stroke="#65d3a5" stroke-width="3"/>
        <text x="52" y="33" fill="#edf7ff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">Skills</text>
        <text x="24" y="59" fill="#7798af" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11">me://skills</text>
      </g>
      <g transform="translate(320 430)">
        <rect width="172" height="78" rx="18" fill="#102a45" stroke="#315a78"/>
        <circle cx="30" cy="30" r="11" fill="none" stroke="#ac91f4" stroke-width="3"/>
        <path d="M30 17v26M17 30h26" stroke="#ac91f4" stroke-width="2"/>
        <text x="52" y="33" fill="#edf7ff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">Goals</text>
        <text x="24" y="59" fill="#7798af" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11">me://goals</text>
      </g>

      <g transform="translate(64 558)">
        <circle cx="8" cy="8" r="8" fill="#3fb950"/>
        <text x="27" y="14" fill="#9ab7cb" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="650">Claude</text>
        <circle cx="132" cy="8" r="8" fill="#3fb950"/>
        <text x="151" y="14" fill="#9ab7cb" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="650">Cursor</text>
        <circle cx="249" cy="8" r="8" fill="#3fb950"/>
        <text x="268" y="14" fill="#9ab7cb" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="650">Codex</text>
        <circle cx="361" cy="8" r="8" fill="#3fb950"/>
        <text x="380" y="14" fill="#9ab7cb" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="650">Any AI</text>
      </g>
    </g>
  </g>

  <g transform="translate(92 834)">
    <text fill="#8ca9bd" font-family="Inter,Segoe UI,sans-serif" font-size="17">mcp-me.page</text>
    <text x="1416" text-anchor="end" fill="#8ca9bd" font-family="Inter,Segoe UI,sans-serif" font-size="17">github.com/paladini/mcp-me</text>
  </g>
</svg>
