<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">How mcp-me shares personal context</title>
  <desc id="desc">A four-step diagram showing a person creating a local YAML profile, mcp-me exposing it through MCP, and AI assistants using the context.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eaf4fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#82c4f2"/>
      <stop offset="1" stop-color="#397fb4"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b49"/>
      <stop offset="1" stop-color="#081827"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2f6c99" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#397fb4"/>
    </marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#244b68" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1440" height="720" rx="28" fill="url(#surface)"/>
  <rect width="1440" height="720" rx="28" fill="url(#grid)"/>
  <circle cx="75" cy="75" r="145" fill="#dceefa" opacity="0.75"/>
  <circle cx="1370" cy="650" r="200" fill="#d9ecf8" opacity="0.72"/>

  <text x="72" y="82" fill="#0b2035" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="750" letter-spacing="-1.2">One profile. Useful context everywhere.</text>
  <text x="72" y="120" fill="#547087" font-family="Inter,Segoe UI,sans-serif" font-size="18">You own the data. mcp-me handles the connection.</text>

  <g transform="translate(54 172)">
    <g filter="url(#shadow)">
      <rect width="246" height="430" rx="28" fill="#ffffff" stroke="#c6ddeb" stroke-width="2"/>
      <rect x="24" y="24" width="54" height="27" rx="13.5" fill="#e5f3fc"/>
      <text x="51" y="42" text-anchor="middle" fill="#397fb4" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="750">STEP 1</text>
      <circle cx="123" cy="141" r="58" fill="#e8f4fb"/>
      <circle cx="118" cy="130" r="21" fill="url(#blue)"/>
      <path d="M85 178c0-23 13-38 33-38s33 15 33 38" fill="none" stroke="#4e99ce" stroke-width="10" stroke-linecap="round"/>
      <circle cx="157" cy="101" r="12" fill="#f5d76e"/>
      <path d="M157 84v34M140 101h34" stroke="#f5d76e" stroke-width="5" stroke-linecap="round"/>
      <text x="123" y="243" text-anchor="middle" fill="#0c2237" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="750">You decide</text>
      <text x="123" y="278" text-anchor="middle" fill="#607a90" font-family="Inter,Segoe UI,sans-serif" font-size="15">Choose what your AI</text>
      <text x="123" y="300" text-anchor="middle" fill="#607a90" font-family="Inter,Segoe UI,sans-serif" font-size="15">should know about you.</text>
      <g transform="translate(30 334)">
        <rect width="80" height="28" rx="14" fill="#eef6fb"/>
        <text x="40" y="19" text-anchor="middle" fill="#44677f" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700">IDENTITY</text>
        <rect x="89" width="68" height="28" rx="14" fill="#eef6fb"/>
        <text x="123" y="19" text-anchor="middle" fill="#44677f" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700">SKILLS</text>
        <rect x="44" y="38" width="100" height="28" rx="14" fill="#eef6fb"/>
        <text x="94" y="57" text-anchor="middle" fill="#44677f" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700">PROJECTS</text>
      </g>
    </g>

    <path d="M262 215H326" fill="none" stroke="#397fb4" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(342)" filter="url(#shadow)">
      <rect width="286" height="430" rx="28" fill="#ffffff" stroke="#c6ddeb" stroke-width="2"/>
      <rect x="24" y="24" width="54" height="27" rx="13.5" fill="#e5f3fc"/>
      <text x="51" y="42" text-anchor="middle" fill="#397fb4" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="750">STEP 2</text>
      <text x="143" y="92" text-anchor="middle" fill="#0c2237" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="750">Local profile</text>
      <text x="143" y="119" text-anchor="middle" fill="#607a90" font-family="Inter,Segoe UI,sans-serif" font-size="14">Readable YAML files on your machine</text>
      <g transform="translate(34 148)">
        <rect x="20" y="18" width="198" height="206" rx="16" fill="#dbeaf4"/>
        <rect x="10" y="9" width="198" height="206" rx="16" fill="#eaf4fa" stroke="#bdd6e6"/>
        <rect width="198" height="206" rx="16" fill="#0d2135"/>
        <circle cx="19" cy="19" r="4" fill="#ef6a6a"/>
        <circle cx="33" cy="19" r="4" fill="#f5d76e"/>
        <circle cx="47" cy="19" r="4" fill="#3fb950"/>
        <text x="18" y="52" fill="#77bdf0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">identity:</text>
        <text x="31" y="77" fill="#d9e7f2" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">name: Ada</text>
        <text x="31" y="102" fill="#d9e7f2" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">role: Engineer</text>
        <text x="18" y="137" fill="#77bdf0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">skills:</text>
        <text x="31" y="162" fill="#f5d76e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">- TypeScript</text>
        <text x="31" y="187" fill="#f5d76e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">- Systems design</text>
      </g>
      <circle cx="113" cy="392" r="4" fill="#3fb950"/>
      <text x="125" y="397" fill="#56758c" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="650">Private by default</text>
    </g>

    <path d="M644 215H708" fill="none" stroke="#397fb4" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(724)" filter="url(#shadow)">
      <rect width="246" height="430" rx="28" fill="url(#navy)" stroke="#2f6f9c" stroke-width="2"/>
      <rect x="24" y="24" width="54" height="27" rx="13.5" fill="#173b5e"/>
      <text x="51" y="42" text-anchor="middle" fill="#8ec8ef" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="750">STEP 3</text>
      <circle cx="123" cy="153" r="72" fill="#123654" stroke="#397fb4" stroke-width="2"/>
      <circle cx="123" cy="153" r="50" fill="#e8f4fb"/>
      <circle cx="119" cy="144" r="18" fill="url(#blue)"/>
      <path d="M92 183c0-20 11-33 27-33s27 13 27 33" fill="none" stroke="#4e99ce" stroke-width="8" stroke-linecap="round"/>
      <circle cx="150" cy="121" r="10" fill="#f5d76e"/>
      <path d="M150 107v28M136 121h28" stroke="#f5d76e" stroke-width="4" stroke-linecap="round"/>
      <text x="123" y="268" text-anchor="middle" fill="#f8fbff" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="750">mcp-me</text>
      <text x="123" y="298" text-anchor="middle" fill="#9bb8cf" font-family="Inter,Segoe UI,sans-serif" font-size="14">Exposes your profile as</text>
      <text x="123" y="320" text-anchor="middle" fill="#9bb8cf" font-family="Inter,Segoe UI,sans-serif" font-size="14">standard MCP resources.</text>
      <g transform="translate(40 354)">
        <rect width="166" height="40" rx="20" fill="#f5d76e"/>
        <text x="83" y="26" text-anchor="middle" fill="#3c3412" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="800">MCP SERVER</text>
      </g>
    </g>

    <path d="M986 215H1050" fill="none" stroke="#397fb4" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(1066)" filter="url(#shadow)">
      <rect width="266" height="430" rx="28" fill="#ffffff" stroke="#c6ddeb" stroke-width="2"/>
      <rect x="24" y="24" width="54" height="27" rx="13.5" fill="#e5f3fc"/>
      <text x="51" y="42" text-anchor="middle" fill="#397fb4" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="750">STEP 4</text>
      <text x="133" y="92" text-anchor="middle" fill="#0c2237" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="750">Any assistant</text>
      <text x="133" y="119" text-anchor="middle" fill="#607a90" font-family="Inter,Segoe UI,sans-serif" font-size="14">Gets useful context on demand</text>
      <g transform="translate(28 148)">
        <rect width="210" height="54" rx="14" fill="#eff7fc" stroke="#c8deeb"/>
        <circle cx="28" cy="27" r="10" fill="#82c4f2"/>
        <text x="49" y="25" fill="#17334a" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">Claude Desktop</text>
        <text x="49" y="42" fill="#6c879b" font-family="Inter,Segoe UI,sans-serif" font-size="10">reads me://skills</text>
        <rect y="68" width="210" height="54" rx="14" fill="#eff7fc" stroke="#c8deeb"/>
        <rect x="18" y="85" width="20" height="20" rx="5" fill="#f5d76e"/>
        <text x="49" y="93" fill="#17334a" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">Cursor</text>
        <text x="49" y="110" fill="#6c879b" font-family="Inter,Segoe UI,sans-serif" font-size="10">reads me://projects</text>
        <rect y="136" width="210" height="54" rx="14" fill="#eff7fc" stroke="#c8deeb"/>
        <path d="M18 154l10-6 10 6v12l-10 6-10-6z" fill="#aa91f5"/>
        <text x="49" y="161" fill="#17334a" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">Codex</text>
        <text x="49" y="178" fill="#6c879b" font-family="Inter,Segoe UI,sans-serif" font-size="10">reads me://career</text>
        <rect y="204" width="210" height="54" rx="14" fill="#eff7fc" stroke="#c8deeb"/>
        <circle cx="28" cy="231" r="10" fill="#65d3a5"/>
        <text x="49" y="229" fill="#17334a" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">Any MCP client</text>
        <text x="49" y="246" fill="#6c879b" font-family="Inter,Segoe UI,sans-serif" font-size="10">uses the same profile</text>
      </g>
    </g>
  </g>

  <g transform="translate(54 640)">
    <circle cx="8" cy="8" r="8" fill="#3fb950"/>
    <path d="M4 8l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="14" fill="#496b82" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="650">Edit once</text>
    <circle cx="143" cy="8" r="8" fill="#3fb950"/>
    <path d="M139 8l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="163" y="14" fill="#496b82" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="650">Keep it local</text>
    <circle cx="305" cy="8" r="8" fill="#3fb950"/>
    <path d="M301 8l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="325" y="14" fill="#496b82" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="650">Use it everywhere</text>
  </g>
  <text x="1386" y="654" text-anchor="end" fill="#66849a" font-family="Inter,Segoe UI,sans-serif" font-size="15">mcp-me.page</text>
</svg>
