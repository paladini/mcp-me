<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">mcp-me social preview</title>
  <desc id="desc">A dark social card for mcp-me showing a local personal profile connected to multiple AI assistants.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#123052"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8dcff"/>
      <stop offset="1" stop-color="#4ea1e0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8fcaff" opacity="0.12"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4ea1e0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4ea1e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#02060d" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="938" cy="315" r="350" fill="url(#glow)"/>
  <path d="M0 536C183 492 352 579 544 532C726 487 850 430 1037 466C1107 480 1162 506 1200 526V630H0Z" fill="#06101d" opacity="0.68"/>

  <g transform="translate(72 68)">
    <circle cx="28" cy="28" r="28" fill="#e8f4ff"/>
    <circle cx="26" cy="23" r="9" fill="url(#blue)"/>
    <path d="M13 46c0-9 5-15 13-15s13 6 13 15" fill="none" stroke="#4ea1e0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="42" cy="14" r="6" fill="#f5d76e"/>
    <path d="M42 4v20M32 14h20" stroke="#f5d76e" stroke-width="3" stroke-linecap="round"/>
    <text x="72" y="39" fill="#f8fbff" font-family="Inter,Segoe UI,sans-serif" font-size="31" font-weight="750">mcp-me</text>
  </g>

  <g transform="translate(72 170)">
    <rect width="226" height="34" rx="17" fill="#102c49" stroke="#2f6189"/>
    <circle cx="20" cy="17" r="5" fill="#3fb950"/>
    <text x="36" y="22" fill="#b9d9f2" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">LOCAL IDENTITY FOR AI</text>

    <text x="0" y="102" fill="#f8fbff" font-family="Inter,Segoe UI,sans-serif" font-size="52" font-weight="750" letter-spacing="-1.8">
      <tspan x="0">Your AI should know</tspan>
      <tspan x="0" dy="64">who it is working with.</tspan>
    </text>
    <text x="0" y="254" fill="#a9c3d9" font-family="Inter,Segoe UI,sans-serif" font-size="20">
      <tspan x="0">A structured, local-first personal profile</tspan>
      <tspan x="0" dy="30">for every MCP-compatible assistant.</tspan>
    </text>

    <g transform="translate(0 331)">
      <rect width="118" height="34" rx="17" fill="#132c48" stroke="#305b7e"/>
      <text x="59" y="22" text-anchor="middle" fill="#cfe8fb" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700">LOCAL FIRST</text>
      <rect x="130" width="118" height="34" rx="17" fill="#2e2b1d" stroke="#675f31"/>
      <text x="189" y="22" text-anchor="middle" fill="#f5d76e" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700">MCP NATIVE</text>
      <rect x="260" width="126" height="34" rx="17" fill="#153026" stroke="#2e6a50"/>
      <text x="323" y="22" text-anchor="middle" fill="#82d9ac" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700">OPEN SOURCE</text>
    </g>
  </g>

  <g transform="translate(720 110)" filter="url(#shadow)">
    <path d="M201 110V58M201 58H47M201 58h154M201 304v58M201 362H47M201 362h154" fill="none" stroke="#71b4e7" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M47 58v63M355 58v63M47 362v-63M355 362v-63" fill="none" stroke="#71b4e7" stroke-opacity="0.5" stroke-width="2"/>

    <g transform="translate(104 110)">
      <rect width="194" height="196" rx="30" fill="#102943" stroke="#4989b9" stroke-width="2"/>
      <circle cx="97" cy="73" r="48" fill="#e8f4ff"/>
      <circle cx="93" cy="66" r="18" fill="url(#blue)"/>
      <path d="M67 108c0-17 10-28 26-28s26 11 26 28" fill="none" stroke="#4ea1e0" stroke-width="8" stroke-linecap="round"/>
      <circle cx="125" cy="42" r="10" fill="#f5d76e"/>
      <path d="M125 27v30M110 42h30" stroke="#f5d76e" stroke-width="4" stroke-linecap="round"/>
      <text x="97" y="151" text-anchor="middle" fill="#f8fbff" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">mcp-me</text>
      <text x="97" y="175" text-anchor="middle" fill="#8caec8" font-family="Inter,Segoe UI,sans-serif" font-size="13">your context, structured</text>
    </g>

    <g>
      <rect width="94" height="58" rx="14" fill="#122943" stroke="#315675"/>
      <circle cx="22" cy="22" r="7" fill="#8bc8f4"/>
      <text x="39" y="27" fill="#eaf6ff" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Claude</text>
      <circle cx="22" cy="41" r="3" fill="#3fb950"/>
      <text x="31" y="45" fill="#718da4" font-family="Inter,Segoe UI,sans-serif" font-size="9">connected</text>
    </g>
    <g transform="translate(308)">
      <rect width="94" height="58" rx="14" fill="#122943" stroke="#315675"/>
      <path d="M16 17h14v14H16z" fill="none" stroke="#f5d76e" stroke-width="3"/>
      <text x="39" y="27" fill="#eaf6ff" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Cursor</text>
      <circle cx="22" cy="41" r="3" fill="#3fb950"/>
      <text x="31" y="45" fill="#718da4" font-family="Inter,Segoe UI,sans-serif" font-size="9">connected</text>
    </g>
    <g transform="translate(0 362)">
      <rect width="94" height="58" rx="14" fill="#122943" stroke="#315675"/>
      <path d="M15 18l7-5 7 5v10l-7 5-7-5z" fill="none" stroke="#a88cff" stroke-width="3"/>
      <text x="39" y="27" fill="#eaf6ff" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Codex</text>
      <circle cx="22" cy="41" r="3" fill="#3fb950"/>
      <text x="31" y="45" fill="#718da4" font-family="Inter,Segoe UI,sans-serif" font-size="9">connected</text>
    </g>
    <g transform="translate(308 362)">
      <rect width="94" height="58" rx="14" fill="#122943" stroke="#315675"/>
      <path d="M15 17l14 14M29 17L15 31" stroke="#65d3a5" stroke-width="3" stroke-linecap="round"/>
      <text x="39" y="27" fill="#eaf6ff" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Any AI</text>
      <circle cx="22" cy="41" r="3" fill="#3fb950"/>
      <text x="31" y="45" fill="#718da4" font-family="Inter,Segoe UI,sans-serif" font-size="9">via MCP</text>
    </g>
  </g>

  <text x="1128" y="576" text-anchor="end" fill="#7d9ab1" font-family="Inter,Segoe UI,sans-serif" font-size="17">mcp-me.page</text>
</svg>
